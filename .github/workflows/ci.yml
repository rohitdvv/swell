name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (model calibration, security, guardrails)
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    # The iOS app (mobile/): typecheck, lint, and a full production iOS
    # JavaScript bundle — catches broken imports without Xcode.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/ios-export
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci-placeholder

